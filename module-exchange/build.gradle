dependencies {
    implementation project(':module-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Boot 4 는 RestClientAutoConfiguration 을 starter-web 밖으로 뺐다 — EximBankExchangeRateProvider 가
    // 주입받는 RestClient.Builder 빈이 사라진다.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    // starter 없이 flyway-core 만 두면 Boot 4 에선 FlywayAutoConfiguration 이 없어 마이그레이션이 안 돈다.
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // spring-boot-starter-test 4.x 는 슬라이스 어노테이션을 더 이상 포함하지 않는다 — 쓰는 것만 명시한다.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('processTestResources') {
    from("${rootProject.projectDir}/module-api/src/main/resources") {
        include 'db/migration/**'
    }
    from("${rootProject.projectDir}/module-api/src/test/resources") {
        include 'testcontainers/**'
    }
}
