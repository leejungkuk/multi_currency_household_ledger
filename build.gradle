plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'net.ltgt.errorprone' version '4.3.0' apply false
    id 'com.diffplug.spotless' version '7.2.1' apply false
}

group = 'com.self'
version = '0.0.1-SNAPSHOT'
description = 'multi_currency_household_ledger'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.self'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Spring Boot 3.4.x 는 OSS 지원이 끝나(2025-11-21) BOM 이 더는 보안 패치를 따라가지 않는다.
    // 프레임워크 업그레이드 전까지, 같은 마이너 라인에 수정본이 있는 취약 전이 의존만 여기서 끌어올린다.
    // 값을 지우면 BOM 기본값(tomcat 10.1.34 / nimbus 9.37.3)으로 조용히 되돌아가므로
    // DependencySecurityFloorTest 가 런타임 버전으로 바닥선을 고정한다.
    ext['tomcat.version'] = '10.1.55'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.1"
        }
    }

    dependencies {
        // nimbus-jose-jwt 는 BOM 이 관리하지 않는 spring-security-oauth2-jose 의 전이 의존이라
        // ext 프로퍼티로는 못 바꾼다. constraint 로 올린다(CVE-2025-53864).
        constraints {
            implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
        }

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        errorprone 'com.google.errorprone:error_prone_core:2.36.0'
    }

    // 컴파일 타임 정적 분석 — 테스트가 못 잡는 버그(NPE·자기대입·잘못된 equals 등)를 ERROR 로 차단
    // -Werror: 경고 0 기준선(2026-06-11 정리 완료)을 빌드 게이트로 고정 — 새 경고는 곧 빌드 실패
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Werror'
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated/.*'
            // 테스트는 한글 메서드명이 컨벤션 — UnicodeInCode 만 테스트에서 허용
            if (name.toLowerCase().contains('test')) {
                disable('UnicodeInCode')
            }
        }
    }

    // 포맷 게이트 — spotlessCheck 가 check→build 에 자동 편입된다.
    // palantirJavaFormat: 4-space·120col, 기존 Spring 스타일과 가장 근접한 포맷터.
    spotless {
        java {
            target 'src/*/java/**/*.java'
            removeUnusedImports()
            palantirJavaFormat()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('test') {
        // 계약 스냅샷 생성기(@Tag("snapshot"))는 전체 컨텍스트를 부팅하므로 일반 test 에서 제외.
        // :module-api:generateApiSnapshot 로만 실행된다.
        useJUnitPlatform {
            excludeTags 'snapshot'
        }
    }
}
