plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'net.ltgt.errorprone' version '4.3.0' apply false
    id 'com.diffplug.spotless' version '7.2.1' apply false
}

group = 'com.self'
version = '0.0.1-SNAPSHOT'
description = 'multi_currency_household_ledger'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.self'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Boot 4.1.0 BOM 이 정하는 전이 의존성의 알려진 CVE 를 패치 라인으로 끌어올린다.
    // Dependabot 은 BOM 이 버전을 정하는 전이 의존성에 PR 을 만들지 못하므로 수동 override 가 유일한 경로다.
    // 제거 조건: Boot BOM 이 이 버전 이상을 담게 되면 해당 줄을 지운다.
    // 확인: ./gradlew :module-api:dependencyInsight --dependency <coord> --configuration runtimeClasspath
    ext['postgresql.version'] = '42.7.12'      // CVE-2026-54291 (HIGH, 채널 바인딩 조용한 다운그레이드)
    ext['jackson-2-bom.version'] = '2.21.4'    // CVE-2026-59889 · CVE-2026-54515 · GHSA-mhm7-754m-9p8w
    ext['jackson-bom.version'] = '3.1.5'       // CVE-2026-59889

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        errorprone 'com.google.errorprone:error_prone_core:2.36.0'
    }

    // 컴파일 타임 정적 분석 — 테스트가 못 잡는 버그(NPE·자기대입·잘못된 equals 등)를 ERROR 로 차단
    // -Werror: 경고 0 기준선(2026-06-11 정리 완료)을 빌드 게이트로 고정 — 새 경고는 곧 빌드 실패
    // -Xlint:deprecation: -Werror 만으로는 forRemoval=true 인 API 만 걸린다. 나머지 @Deprecated 사용은
    // Note 로만 나가 빌드를 통과하므로, 프레임워크 업그레이드가 남기는 폐기 API 사용을 놓친다.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Werror' << '-Xlint:deprecation'
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated/.*'
            // 테스트는 한글 메서드명이 컨벤션 — UnicodeInCode 만 테스트에서 허용
            if (name.toLowerCase().contains('test')) {
                disable('UnicodeInCode')
            }
        }
    }

    // 포맷 게이트 — spotlessCheck 가 check→build 에 자동 편입된다.
    // palantirJavaFormat: 4-space·120col, 기존 Spring 스타일과 가장 근접한 포맷터.
    spotless {
        java {
            target 'src/*/java/**/*.java'
            removeUnusedImports()
            palantirJavaFormat()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('test') {
        // 계약 스냅샷 생성기(@Tag("snapshot"))는 전체 컨텍스트를 부팅하므로 일반 test 에서 제외.
        // :module-api:generateApiSnapshot 로만 실행된다.
        useJUnitPlatform {
            excludeTags 'snapshot'
        }
    }
}
