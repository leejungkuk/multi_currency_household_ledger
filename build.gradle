plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'net.ltgt.errorprone' version '4.3.0' apply false
    id 'com.diffplug.spotless' version '7.2.1' apply false
}

group = 'com.self'
version = '0.0.1-SNAPSHOT'
description = 'multi_currency_household_ledger'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.self'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Boot 3.4.x 의 OSS 지원 종료(2025-11-21)를 메우려고 넣은 임시 핀. 경유 중인 3.5.16 BOM 도 tomcat
    // 10.1.55 를 관리하므로 지금은 같은 값(no-op)이고, DependencySecurityFloorTest 가 런타임 버전으로
    // 바닥선을 지킨다.
    // 주의: 이건 conflict resolution 이 아니라 BOM 프로퍼티 하드 오버라이드다. Boot 4 BOM 은 tomcat
    // 11.x(Servlet 6.1)를 관리하므로 이 줄이 남으면 10.1.55 로 강제 다운그레이드되고, 바닥선 테스트는
    // >= 비교라 그걸 잡지 못한다 — Boot 4 로 올릴 때 이 줄부터 지운다.
    ext['tomcat.version'] = '10.1.55'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.16"
        }
    }

    dependencies {
        // nimbus-jose-jwt 는 BOM 이 관리하지 않는 spring-security-oauth2-jose 의 전이 의존이라
        // ext 프로퍼티로는 못 바꾼다. constraint 로 올린다(CVE-2025-53864).
        // 3.5.16 이 끌고 오는 security 6.5.11 의 전이 버전이 이미 9.37.4 라 현재는 no-op 이다. 위 tomcat 핀과
        // 달리 constraint 는 하한이라 상위 버전을 끌어내리지 않는다 — 남아도 다운그레이드는 없다.
        constraints {
            implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
        }

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        errorprone 'com.google.errorprone:error_prone_core:2.36.0'
    }

    // 컴파일 타임 정적 분석 — 테스트가 못 잡는 버그(NPE·자기대입·잘못된 equals 등)를 ERROR 로 차단
    // -Werror: 경고 0 기준선(2026-06-11 정리 완료)을 빌드 게이트로 고정 — 새 경고는 곧 빌드 실패
    // -Xlint:deprecation: -Werror 만으로는 forRemoval=true 인 API 만 걸린다. 나머지 @Deprecated 사용은
    // Note 로만 나가 빌드를 통과하므로, 프레임워크 업그레이드가 남기는 폐기 API 사용을 놓친다.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Werror' << '-Xlint:deprecation'
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated/.*'
            // 테스트는 한글 메서드명이 컨벤션 — UnicodeInCode 만 테스트에서 허용
            if (name.toLowerCase().contains('test')) {
                disable('UnicodeInCode')
            }
        }
    }

    // 포맷 게이트 — spotlessCheck 가 check→build 에 자동 편입된다.
    // palantirJavaFormat: 4-space·120col, 기존 Spring 스타일과 가장 근접한 포맷터.
    spotless {
        java {
            target 'src/*/java/**/*.java'
            removeUnusedImports()
            palantirJavaFormat()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('test') {
        // 계약 스냅샷 생성기(@Tag("snapshot"))는 전체 컨텍스트를 부팅하므로 일반 test 에서 제외.
        // :module-api:generateApiSnapshot 로만 실행된다.
        useJUnitPlatform {
            excludeTags 'snapshot'
        }
    }
}
