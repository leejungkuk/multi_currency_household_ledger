# 보안 전용 — open-pull-requests-limit: 0 으로 일상 버전범프 PR은 끄고
# 보안(CVE) 업데이트 PR만 자동 생성한다(보안 업데이트는 이 제한을 무시함).
# github-actions 는 SHA 핀 갱신을 위해 일상 버전범프 PR도 허용한다.
# docker-compose 는 그 예외가 아니라 **보안 업데이트가 아예 없는** 생태계다 — 아래 주석 참조.
# build.yml CI 가 각 PR 을 검증한다.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"

  # 관측 스택 이미지 6종(prometheus·node-exporter·loki·docker-socket-proxy·alloy·grafana).
  # 여기만 일상 버전범프를 허용하는 이유: 컨테이너 이미지는 GitHub Advisory Database 대상이 아니라
  # docker-compose 생태계에 **security update 가 존재하지 않는다**(version update 전용).
  # limit: 0 을 그대로 쓰면 PR 이 한 건도 오지 않아 감시가 있다는 착각만 남는다.
  # 즉 "새 태그가 나왔다"가 이 계층에서 얻을 수 있는 유일한 보안 신호다.
  #
  # api 이미지의 base(eclipse-temurin)는 여기 없어도 된다 — publish-image.yml 의 Trivy 이미지
  # 스캔이 빌드된 결과물을 직접 보고 CRITICAL/HIGH 를 차단한다.
  # 엣지 caddy 는 리포 밖 deploy/ 에 있어 Dependabot 사정권 밖이다(DEPLOY.md §남은 일).
  - package-ecosystem: "docker-compose"
    directory: "/monitoring"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
