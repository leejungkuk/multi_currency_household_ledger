name: build

# 로컬 Claude 훅(pre-commit-build 등)은 --no-verify 로 우회 가능하고 다른 기기에선
# 강제되지 않는다. 이 워크플로가 서버측 강제 게이트다 — main 으로의 PR과 feature 푸시에서
# ./gradlew build(Spotless 린트 + 컴파일 + 전 모듈 테스트)를 돌린다.
# main 브랜치 보호(PR 필수 + 이 체크 통과 필수)는 GitHub 저장소 설정에서 별도로 켠다.

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트 DB는 Testcontainers(postgres:16-alpine, @ServiceConnection)가 테스트 프로세스에서
    # 직접 띄운다 — ubuntu-latest 러너에 Docker가 내장돼 있어 별도 서비스 컨테이너가 필요 없다.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 시크릿(exchange.eximbank.api-key 등)은 불필요하다: @SpringBootTest도 테스트 프로퍼티로
      # 더미 키를 주입하며 외부 API를 호출하지 않는다.
      - name: Build (Spotless + compile + test)
        run: ./gradlew build --no-daemon
