name: build

# 로컬 Claude 훅(pre-commit-build 등)은 --no-verify 로 우회 가능하고 다른 기기에선
# 강제되지 않는다. 이 워크플로가 서버측 강제 게이트다 — main 으로의 PR과 feature 푸시에서
# ./gradlew build(Spotless 린트 + 컴파일 + 전 모듈 테스트)를 돌린다.
# main 브랜치 보호(PR 필수 + 이 체크 통과 필수)는 GitHub 저장소 설정에서 별도로 켠다.

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # permissions 를 선언하는 순간 명시하지 않은 권한은 전부 none 이 된다 — checkout 도 contents: read 가 있어야 돈다.
    permissions:
      contents: read
      security-events: write

    # 테스트 DB는 Testcontainers(postgres:16-alpine, @ServiceConnection)가 테스트 프로세스에서
    # 직접 띄운다 — ubuntu-latest 러너에 Docker가 내장돼 있어 별도 서비스 컨테이너가 필요 없다.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6

      # 시크릿(exchange.eximbank.api-key 등)은 불필요하다: @SpringBootTest도 테스트 프로퍼티로
      # 더미 키를 주입하며 외부 API를 호출하지 않는다.
      - name: Build (Spotless + compile + test)
        run: ./gradlew build --no-daemon

      # 취약점을 "찾았을 때" 의 반환코드는 0 = 비차단(S1). 이것과 별개로 DB 다운로드 실패·rate limit·타임아웃은
      # trivy 가 non-zero 를 내 잡을 빨갛게 만들므로 continue-on-error 를 따로 건다(D-b′).
      # 한계를 명시적으로 감수한다: 스캔이 실패하면 SARIF 가 없어 "발견 0건" 과 구분되지 않는다.
      - name: Scan bootJar for known vulnerabilities (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          # 파일명이 아니라 디렉터리를 스캔한다 — 버전이 바뀌면 파일명 하드코딩은 조용히 0건이 된다.
          # 같은 디렉터리의 -plain.jar 도 함께 잡히는 것은 의도한 것이다(SARIF 중복제거가 흡수한다).
          # ⚠️ fs 가 아니라 rootfs 다. fs 는 소스 트리의 매니페스트·락파일만 보는 모드라 바이너리 jar 분석기가
          # 붙지 않아 이 스캔은 한 번도 무언가를 찾은 적이 없었다(발견 0건 = 안전이 아니라 안 봤다는 뜻).
          # rootfs 는 이미지 스캔과 같은 분석기 집합을 써서 bootJar 의 중첩 jar(BOOT-INF/lib/*.jar)까지 걷는다.
          scan-type: rootfs
          scan-ref: module-api/build/libs
          # 시크릿 스캔은 GitHub secret scanning + push protection 이 이미 담당한다. 중복 알림을 만들지 않는다.
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          # ⚠️ Dependabot 은 uses: 의 SHA 만 갱신한다. 이 바이너리 버전은 with: 입력이라 자동으로 오르지 않으므로
          # trivy-action 범프 PR 이 올 때 함께 올린다. 방치하면 DB 스키마가 앞서 나가 다운로드가 실패하고,
          # 이 잡은 continue-on-error 라 그 실패가 조용히 무스캔이 된다.
          version: v0.72.0

      # Dependabot 브랜치의 push 런만 GITHUB_TOKEN 이 읽기 전용으로 강등돼 업로드가 403 이다.
      # 같은 브랜치의 pull_request 런은 정상 업로드된다 — Code Scanning 은 pull_request 이벤트에 명시적 예외를 둔다
      # ("code scanning always allows the uploading of results when the pull_request event triggers the action run").
      # 포크 여부로 가드하지 마라 — 정상 PR 결과까지 버린다.
      - name: Upload Trivy (fs) results
        if: >-
          always()
          && hashFiles('trivy-fs.sarif') != ''
          && !(github.event_name == 'push' && github.actor == 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          sarif_file: trivy-fs.sarif
          # category 가 있어야 Security 탭에서 fs 분석과 image 분석이 별개로 구분된다(§5 판정의 전제).
          category: trivy-fs

      # 위 보고용 스캔과 같은 산출물을 한 번 더 스캔하되, 이번엔 exit code 로 판정해 PR 을 막는다.
      # 보고용 스텝에 severity + exit-code 를 얹어 차단할 수는 없다 — trivy-action 의 entrypoint 가
      # format=sarif 에서 TRIVY_SEVERITY 를 unset 하므로 LOW·MEDIUM 에도 PR 이 막힌다.
      - name: Trivy gate (CRITICAL/HIGH 차단)
        env:
          # trivy-action 이 actions/cache 로 복원해 둔 DB 를 그대로 쓴다. 이 env 는 액션 내부 스텝에만 주입되고
          # 밖으로 전파되지 않으므로(action.yaml 의 "Remove Trivy envs ... avoid env leaks") 여기서 다시 준다 —
          # 없으면 게이트만 따로 DB 를 받고, 그 다운로드 실패가 조용한 fail-open 이 된다.
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          # 스캔 대상이 비어 있으면 trivy 는 "발견 0" 으로 초록을 낸다. 차단 게이트에서 그건 조용한 무력화다.
          # 개수로는 못 잡는다 — 의존성이 0개인 -plain.jar 만 남아도 개수는 1 이고 trivy 는 "Not scanned" 로 초록이다.
          # 그래서 파일명이 아니라 내용으로 판정한다: bootJar 는 의존성을 BOOT-INF/lib/*.jar 로 품는다.
          shopt -s nullglob
          for jar in module-api/build/libs/*.jar; do unzip -l "$jar" | grep -q 'BOOT-INF/lib/.*\.jar' && scannable=$jar && break; done
          [ -n "${scannable-}" ] || { echo "::error::의존성을 품은 jar 가 없다(BOOT-INF/lib/*.jar 미검출) — 게이트가 빈손으로 통과할 뻔했다"; exit 1; }

          # 스캐너 부재는 §6-4 의 "돌다가 죽은 것" 과 다른 사건이다 — 스캔이 아예 일어나지 않아 정보가 0 이고,
          # 원인(setup-trivy 의 버전·핀·캐시)이 고쳐질 때까지 지속된다. 그래서 장애와 달리 차단한다.
          command -v trivy >/dev/null || { echo "::error::Trivy 가 PATH 에 없다 — 스캐너가 설치되지 않아 게이트가 한 번도 실행되지 못했다(setup-trivy 실패 의심)"; exit 1; }

          # rootfs: fs 는 매니페스트·락파일만 보고 jar 를 스캔하지 않는다.
          # --exit-code 2: 필터를 통과한 발견에만 이 값이 나온다. 그래서 아래 case 는 2 만 차단하고 나머지 오류는 비차단으로 흘린다.
          trivy rootfs --scanners vuln --severity CRITICAL,HIGH \
            --cache-dir /tmp/e2e-cold-cache --db-repository ghcr.io/aquasecurity/nonexistent-db \
            --exit-code 2 module-api/build/libs/ || code=$?
          case "${code:-0}" in
            0) echo "차단 대상 없음" ;;
            2) echo "::error::CRITICAL/HIGH 발견 — 머지 차단"; exit 1 ;;
            *) echo "::warning::Trivy 장애(exit=${code}) — 비차단(선행 플랜 §6-4)" ;;
          esac
