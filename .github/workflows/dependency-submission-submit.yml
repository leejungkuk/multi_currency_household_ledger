name: dependency-submission-submit

# dependency-submission.yml 이 만들어 아티팩트로 올린 그래프를 받아 Dependency Submission API 로 제출한다.
# 이 워크플로에 checkout·setup-java·Gradle 이 없는 것이 핵심이다 — contents: write 를 쥔 런타임에서
# 프로젝트 빌드 스크립트나 서드파티 Gradle 플러그인이 실행되지 않는다.
on:
  workflow_run:
    workflows: [ dependency-submission ]
    types: [ completed ]

jobs:
  submit:
    # 생성이 실패했으면 받을 아티팩트가 없다. 성공한 런만 처리한다.
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    # actions: read 는 선행 런의 아티팩트를 내려받기 위해 필요하다.
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          dependency-graph: download-and-submit
