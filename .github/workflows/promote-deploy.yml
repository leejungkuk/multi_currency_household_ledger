name: promote-deploy

# main 에 이미 구워진 이미지 하나를 :deploy 태그로 옮긴다. 호스트의 배포 에이전트(tools/deploy-agent.sh)가
# 폴링하는 태그는 :deploy 뿐이므로 이 워크플로를 실행하는 행위 자체가 유일한 배포 승인 게이트다(플랜 D1).
# 트리거가 workflow_dispatch 뿐인 이유(D11): 배포와 롤백이 워크플로 하나로 끝난다 — 이전 sha 를 넣으면
# 그것이 곧 롤백이다. push·schedule 을 얹으면 사람 승인이 우회되고, Environments + required reviewers 는
# 승인이 머지 커밋에 묶여 임의의 과거 sha 를 승격할 수단이 없어진다.
# 두 색 배포에서는 옛 버전이 새 스키마 위에서 수십 초 서비스하므로, 옛 버전과 공존하지 못할 수 있는 새 마이그레이션은
# 감지기(tools/migration-ddl-guard.py)가 destructive_migrations 확인 입력을 따로 요구한다. 감지는 정규식 휴리스틱이라
# 최종 판단은 여전히 사람이다.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '승격할 커밋 sha (40자 hex, main 에 머지된 커밋)'
        required: true
      migrations_reviewed:
        description: '요약의 마이그레이션 목록을 확인했다면 reviewed 를 그대로 입력'
        required: true
      destructive_migrations:
        description: '감지된 파괴적 마이그레이션 버전을 쉼표로(예: V15,V16). 없으면 비운다'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository }}

# 승격은 한 번에 하나만 돈다. 겹치면 한쪽이 검사한 :deploy 기준을 다른 쪽 승격(예: 롤백)이 먼저 바꿔, 실제로 건너뛰는
# 마이그레이션이 파괴적 변경 확인에서 빠진다. 진행 중인 승격은 취소하지 않는다(대기 중인 실행은 새 실행이 오면 GitHub 가 취소한다).
concurrency:
  group: promote-deploy
  cancel-in-progress: false

defaults:
  run:
    # 셸을 명시하면 -eo pipefail 로 뜬다. 기본값은 -e 뿐이라 파이프 앞쪽 실패를 삼켜, digest 조회가 실패해도
    # 뒤쪽 jq 의 종료코드로 초록이 된다.
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-latest

    # 태그를 옮기는 데 필요한 것은 이 둘뿐이다. write:packages 자격증명만 유출돼도 리포를 건드리지 않고
    # 승인 게이트를 우회하므로(플랜 §6 신뢰 경계 ①) 권한 면적을 이보다 넓히지 않는다.
    permissions:
      contents: read
      packages: write

    steps:
      # 조상 판정에 checkout 을 쓰지 않는다 — 조상 판정은 API 로, 승격은 레지스트리에서만 일어난다.
      # git merge-base 는 쓸 수 없다: actions/checkout 기본 fetch-depth: 1 에서는 항상 실패해
      # 이전 sha 를 되돌리는 롤백 승격(S7)이 통째로 막힌다.
      #
      # ⚠️ 입력은 전부 env: 로 넘겨 "$VAR" 로 참조한다. ${{ inputs.* }} 를 run: 본문에 직접 박으면
      # 입력 문자열이 스크립트로 합성돼 실행된다(스크립트 인젝션).
      - name: Validate sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha 는 40자 소문자 hex 여야 한다"; exit 1; }

          # three-dot compare 의 status 로 조상 여부를 판정한다: identical = 현재 main HEAD, behind = main 의 조상.
          # ahead·diverged 는 main 에 없는 커밋이라 build.yml(required check)을 통과했다는 보장이 없다.
          # 잔여 엣지: main 이 force-push 로 재작성되면 과거 배포 sha 가 diverged 가 돼 롤백 승격이 막힌다.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status) \
            || { echo "::error::compare 호출 실패 — 이 리포에 없는 sha 이거나 API 오류다"; exit 1; }
          case "$status" in
            identical | behind) echo "main 조상 확인 (status=$status)" ;;
            *) echo "::error::main 의 조상이 아니다 (status=$status)"; exit 1 ;;
          esac

      # ⚠️ 이것은 게이트가 아니라 사람이 읽는 전체 목록이다. compare API 는 three-dot diff 라 위에서 승인되는 두 status
      # 모두 files 가 항상 0건이어서(실측) 조상 판정 호출로는 "이 승격으로 무엇이 새로 적용되는지"를 알 수 없다.
      # 새로 적용될 것 중 옛 버전과 공존하지 못할 수 있는 후보는 아래 Check destructive migrations 가 지금 :deploy 를
      # 기준으로 계산해 버전 확인을 받는다. 그래도 판단은 사람이 한다(플랜 §8).
      - name: List migrations at target sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          # 조회 실패를 삼키면 빈 목록이 "마이그레이션 없음" 과 구분되지 않는다 — 목록 없이 승격시키지 않는다.
          names=$(gh api "repos/$GITHUB_REPOSITORY/contents/module-api/src/main/resources/db/migration?ref=$SHA" --jq '.[].name') \
            || { echo "::error::마이그레이션 목록 조회 실패 — 목록 없이는 승격하지 않는다"; exit 1; }
          {
            echo "### 승격 대상 \`$SHA\` 의 마이그레이션"
            echo ""
            echo '```'
            echo "$names"
            echo '```'
            echo ""
            echo "서버에 적용된 Flyway 이력과 대조해 사람이 판단한다(이 목록은 게이트가 아니다)."
          } >> "$GITHUB_STEP_SUMMARY"

      # git 커밋 → 호스트 컨테이너 정의 간선의 유일한 완화책은 사람이 이 값을 ntfy와 대조하는 것이다.
      # 조회는 API 한 번이고, 실패한 뒤 태그를 옮기면 이미 호스트가 배포하므로 승격 전에 fail-closed로 막는다.
      - name: Resolve monitoring tree at target sha
        id: monitoring-tree
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$SHA" \
            --jq '.tree[] | select(.path=="monitoring") | .sha') \
            || { echo "::error::monitoring 트리 sha 조회 실패 — 대조값 없이는 승격하지 않는다"; exit 1; }
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::monitoring 트리 sha가 올바른 40자 hex가 아니다"; exit 1; }
          echo "tree_sha=$tree" >> "$GITHUB_OUTPUT"

      # 위 전체 목록을 실제로 읽었다는 확인. 이 입력이 대신하는 것은 "구 이미지와 호환되는 additive 변경이라
      # 무인 배포·자동 롤백이 성립하는가" 라는 사람의 판단이다(Step 0 규칙).
      # 목록 출력보다 뒤에 두는 이유: 문구를 틀려 실패해도 요약에 목록이 남아 그대로 보고 다시 실행할 수 있다.
      # 옛 버전과 공존하지 못할 수 있는 변경은 아래 Check destructive migrations 가 :deploy 기준으로 새 마이그레이션을
      # 계산해 버전을 적은 확인을 따로 요구한다(정규식 휴리스틱이라 이 판단을 대신하지 않는다).
      - name: Confirm migrations reviewed
        env:
          CONFIRM: ${{ inputs.migrations_reviewed }}
        run: |
          [ "$CONFIRM" = reviewed ] \
            || { echo "::error::migrations_reviewed 에 reviewed 를 정확히 입력해야 한다"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 감지기 스크립트를 얻기 위한 checkout 이다 — 조상 판정에는 쓰지 않는다(맨 위 merge-base 주석과 무관).
      # 대상 sha 가 아니라 이 워크플로를 실행한 ref 의 스크립트를 쓴다: 롤백 대상 sha 에는 스크립트가 없을 수 있다.
      # packages: write 토큰을 .git/config 에 남기지 않는다 — 이후 git 인증이 필요한 스텝이 없다.
      - name: Checkout guard script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 새 마이그레이션 = (파일명, blob sha) 쌍이 지금 :deploy 이미지의 revision 에는 없고 대상 sha 에만 있는 파일.
      # 이름만 같고 내용이 다른 파일도 넣는다 — Flyway 전에 죽은 이미지가 :deploy 에 남아 있으면 그 이미지의 미적용 V19 를
      # 대상이 고쳐도 이름 비교로는 빠진다. 감지된 버전 집합이 destructive_migrations 와 정확히 같아야 승격한다.
      # 롤백 승격(대상이 현재보다 뒤)은 새 파일이 없어 빈 입력으로 통과한다.
      - name: Check destructive migrations
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          ACK: ${{ inputs.destructive_migrations }}
        run: |
          # '{{json .Image}}' + jq 인 이유는 아래 .Manifest 와 같다. 이미지가 단일 플랫폼(publish-image.yml linux/arm64)이라
          # .Image 가 설정 객체 하나다(실측) — 멀티 플랫폼이 되면 플랫폼별 맵이라 값이 비고 아래 검사에서 막힌다.
          current=$(docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE:deploy" \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty') \
            || { echo "::error::현재 :deploy 이미지 조회 실패 — 비교 기준 없이는 승격하지 않는다"; exit 1; }
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::현재 :deploy 의 revision 라벨이 40자 hex 가 아니다 — 비교 기준 없이는 승격하지 않는다"; exit 1; }

          # 조회 실패는 위 목록 스텝과 같은 이유로 fail-closed — 빈 목록이 "새 마이그레이션 없음" 과 구분되지 않는다.
          dir=module-api/src/main/resources/db/migration
          # 한 줄 = "<blob sha> <파일명>" — sha 를 앞에 둬 read 의 마지막 변수가 파일명 전체를 받는다.
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/contents/$dir?ref=$current" --jq '.[] | "\(.sha) \(.name)"') \
            || { echo "::error::현재 배포본 $current 의 마이그레이션 목록 조회 실패 — 승격하지 않는다"; exit 1; }
          target=$(gh api "repos/$GITHUB_REPOSITORY/contents/$dir?ref=$SHA" --jq '.[] | "\(.sha) \(.name)"') \
            || { echo "::error::대상 $SHA 의 마이그레이션 목록 조회 실패 — 승격하지 않는다"; exit 1; }

          tmp=$(mktemp -d)
          files=()
          while IFS=' ' read -r _ name; do
            [ -n "$name" ] || continue
            gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/$dir/$name?ref=$SHA" > "$tmp/$name" \
              || { echo "::error::$name 본문 조회 실패 — 승격하지 않는다"; exit 1; }
            files+=("$tmp/$name")
          done < <(comm -13 <(sort <<< "$deployed") <(sort <<< "$target"))

          # pipefail 이라 감지기의 종료 코드가 스텝 결과가 되고, tee 덕에 실패해도 요약에 감지 목록이 남는다.
          python3 tools/migration-ddl-guard.py --expect "$ACK" "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # imagetools create 는 원본 매니페스트를 다시 태그하는 명령이라 digest 가 보존되는 것이 정상이지만,
      # 소스가 여럿이면 새 index 를 조립하는 명령이기도 하므로 보존을 가정하지 않고 실측한다. digest 가 바뀌면
      # 호스트가 pull 하는 바이트가 스캔·검증된 그 이미지와 달라지고, 사람이 대조할 digest 도 의미를 잃는다.
      - name: Promote :sha to :deploy
        id: promote
        env:
          SHA: ${{ inputs.sha }}
        run: |
          # 포맷은 '{{json .Manifest}}' + jq 다. '{{.Manifest.Digest}}' 로는 값이 나오지 않는다(로컬 실측:
          # 매니페스트가 구조체가 아니라 raw JSON 이라 필드 접근이 먹지 않고 사람용 블록이 통째로 찍힌다).
          src=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$SHA" | jq -er .digest)
          docker buildx imagetools create -t "$IMAGE:deploy" "$IMAGE:$SHA"
          dst=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:deploy" | jq -er .digest)
          { echo "source_digest=$src"; echo "deploy_digest=$dst"; } >> "$GITHUB_OUTPUT"

      # 폴백: crane tag 는 원본 매니페스트 바이트를 그대로 PUT 하므로 정의상 digest 를 보존한다.
      # 인증은 위 login-action 이 ~/.docker/config.json 에 남긴 것을 crane 기본 keychain 이 그대로 읽는다.
      - name: Set up crane (digest 미보존 폴백)
        if: steps.promote.outputs.deploy_digest != steps.promote.outputs.source_digest
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      - name: Re-tag with crane
        if: steps.promote.outputs.deploy_digest != steps.promote.outputs.source_digest
        env:
          SHA: ${{ inputs.sha }}
        run: crane tag "$IMAGE:$SHA" deploy

      # 신뢰 경계 ①(레지스트리 태그 → 호스트 코드 실행)의 유일한 완화책은 사람의 대조다: 여기 찍힌 digest 를
      # 배포 성공 ntfy 알림의 값과 맞춰 본다(에이전트는 sha256: 를 뗀 앞 12자로 알린다 — deploy-agent.sh short()).
      - name: Report digests
        env:
          SHA: ${{ inputs.sha }}
          SOURCE: ${{ steps.promote.outputs.source_digest }}
          MONITORING_TREE: ${{ steps.monitoring-tree.outputs.tree_sha }}
        run: |
          dst=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:deploy" | jq -er .digest)
          {
            echo "### 승격 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`$SHA\` |"
            echo "| 원본 digest | \`$SOURCE\` |"
            echo "| \`:deploy\` digest | \`$dst\` |"
            echo "| 배포 ntfy 대조값 | \`${dst:7:12}\` |"
            echo "| monitoring 트리 | \`$MONITORING_TREE\` |"
            echo "| monitoring ntfy 대조값 | \`${MONITORING_TREE:0:12}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$dst" = "$SOURCE" ] \
            || { echo "::error::digest 가 보존되지 않았다 — crane 폴백까지 실패했다"; exit 1; }
