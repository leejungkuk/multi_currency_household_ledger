name: publish-image

# main 에 올라온 커밋을 배포 이미지로 구워 GHCR 에 푸시한다. 테스트 게이트는 PR 단계에서
# build.yml 이 이미 통과시킨 뒤이므로 여기서는 빌드·푸시만 한다(중복 테스트 없음).
# 배포 서버는 이 이미지를 pull 만 하며, 서버에서 소스를 빌드하지 않는다.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # 배포 타깃이 OCI A1(Ampere/ARM64)이라 arm64 네이티브 러너에서 굽는다. x86 러너 + QEMU 로
    # 크로스 빌드하면 Gradle/JVM 컴파일이 통째로 에뮬레이션돼 몇 배 느려진다.
    # public 저장소이므로 이 러너는 과금되지 않는다.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    # 태그(:latest·:sha)는 재실행·workflow_dispatch 로 덮인다. 실제로 구운 산출물을 가리키는 것은 digest 뿐이다.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = 서버 compose 가 참조하는 롤링 태그. sha 태그는 롤백·현재 배포본 식별용이다
      # (latest 만 있으면 "지금 뜬 게 어느 커밋인지"를 이미지만 보고 알 수 없다).
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 소스가 바뀌면 Gradle 레이어는 어차피 무효화되지만, base 이미지·apt 레이어는 재사용된다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 스캐너를 packages: write 토큰과 같은 런타임에 두지 않는다 — Trivy 는 2026 년에 3 연속 침해됐고
  # 페이로드가 Actions Runner 메모리에서 CI 시크릿을 훔쳤다. 침해 시 악성 이미지가 배포 경로로 직행하는 것을 막는다.
  scan-image:
    needs: publish
    # publish 가 실패하면 이 잡은 건너뛴다 — 존재하지 않는 digest 를 스캔하지 않는다.

    # arm64 이미지를 amd64 러너에서 스캔한다. Trivy 는 레이어를 풀어 메타데이터만 읽고 이미지를 실행하지 않으므로
    # 크로스 아키텍처 스캔이 정상 동작하며, arm64 러너에서의 trivy 바이너리 가용성 리스크를 지지 않는다.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      # upload-sarif 가 워크스페이스를 git 리포로 기대하는 경로가 있다. contents: read 를 유지하는 이유.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # packages: read 는 토큰 권한일 뿐 인증 주체가 아니고, 별도 잡이라 publish 의 로그인 상태를 물려받지 않는다.
      # 지금은 패키지가 public 이라 익명 pull 로도 되지만, 가시성이 바뀌면 조용히 스캔 0건이 된다.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 취약점 "발견" 은 비차단이다(exit-code: '0'). 하지만 스캐너·업로드의 *운영 실패* 는 여기서 잡을 빨갛게
      # 만든다 — build.yml 과 정책이 다른 이유는 이 잡이 아무것도 막지 않기 때문이다. build 잡은 브랜치 보호의
      # required check 라 빨개지면 PR 이 막혀 continue-on-error 가 필요하지만, scan-image 는 main 푸시 후에 돌아
      # 차단하는 것이 없다. 여기서 실패를 삼키면 얻는 것은 0 이고, "이미지 스캔이 죽었다" 는 유일한 신호를 잃는다.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          # 필수. build-push-action 은 provenance attestation 을 기본 생성해 단일 플랫폼 빌드여도 OCI *index* 를 푸시하고,
          # outputs.digest 는 그 index 의 digest 다. 실측한 현재 :latest 의 자식은 linux/arm64 와 unknown/unknown 둘뿐 —
          # linux/amd64 가 없다. 플랫폼을 생략하면 Trivy 가 기본값 amd64 자식을 찾다 실패한다.
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
          # ⚠️ Dependabot 은 uses: 의 SHA 만 갱신한다. 이 바이너리 버전은 with: 입력이라 자동으로 오르지 않으므로
          # trivy-action 범프 PR 이 올 때 함께 올린다. 방치하면 DB 스키마가 앞서 나가 다운로드가 실패한다.
          version: v0.72.0

      - name: Upload Trivy (image) results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
