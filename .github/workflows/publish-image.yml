name: publish-image

# main 에 올라온 커밋을 배포 이미지로 구워 GHCR 에 푸시한다. 테스트 게이트는 PR 단계에서
# build.yml 이 이미 통과시킨 뒤이므로 여기서는 빌드·푸시만 한다(중복 테스트 없음).
# 배포 서버는 이 이미지를 pull 만 하며, 서버에서 소스를 빌드하지 않는다.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # 배포 타깃이 OCI A1(Ampere/ARM64)이라 arm64 네이티브 러너에서 굽는다. x86 러너 + QEMU 로
    # 크로스 빌드하면 Gradle/JVM 컴파일이 통째로 에뮬레이션돼 몇 배 느려진다.
    # public 저장소이므로 이 러너는 과금되지 않는다.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = 서버 compose 가 참조하는 롤링 태그. sha 태그는 롤백·현재 배포본 식별용이다
      # (latest 만 있으면 "지금 뜬 게 어느 커밋인지"를 이미지만 보고 알 수 없다).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 소스가 바뀌면 Gradle 레이어는 어차피 무효화되지만, base 이미지·apt 레이어는 재사용된다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
