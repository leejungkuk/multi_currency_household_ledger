spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 단일 인스턴스 + 개인 규모 트래픽이라 기본값 10은 과하다. Supabase 무료 티어의 연결 수도 아껴야 한다.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # show-sql / format_sql 은 application-local.yml 에만 둔다 — 운영에서 켜면 모든 쿼리와 파라미터가
    # 로그로 쏟아져 로그량·성능·정보노출 문제가 된다.
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI}

  jackson:
    time-zone: Asia/Seoul

server:
  compression:
    enabled: true
    mime-types: application/json
    # 주의: min-response-size 는 Content-Length 가 알려진 응답에만 적용된다.
    # Tomcat CompressionConfig.useCompression() 은 getContentLengthLong() == -1 이면 크기 비교를 건너뛴다.
    # Spring MVC 의 JSON 은 chunked 로 나가 Content-Length 가 -1 이므로, gzip 을 수락하는 클라이언트에게는
    # 크기와 무관하게 application/json 응답이 압축된다(Accept-Encoding·기존 Content-Encoding·strong ETag 등
    # 나머지 제외 조건은 그대로 적용된다). 이 값은 Content-Length 가 실리는 응답의 하한으로만 의미가 있다.
    min-response-size: 2KB

woni:
  security:
    jwt:
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    cors:
      allowed-origins: ${WONI_CORS_ALLOWED_ORIGINS:http://localhost:3000}

exchange:
  eximbank:
    api-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    connect-timeout: ${EXIMBANK_CONNECT_TIMEOUT:2s}
    read-timeout: ${EXIMBANK_READ_TIMEOUT:5s}

ledger:
  recalculation:
    window-days: ${LEDGER_RECALCULATION_WINDOW_DAYS:7}
    # 재계산 배치가 한 번에 붙잡는 트랜잭션·힙·커넥션의 상한. 청크마다 트랜잭션을 끊고(chunk-size),
    # 한 주기 처리량도 막는다(max-entries-per-run). 상한에 걸린 나머지는 대상 술어에 그대로 남아
    # 다음 주기가 이어받는다 — 초과분이 영구 동결되지 않는다.
    chunk-size: ${LEDGER_RECALCULATION_CHUNK_SIZE:200}
    max-entries-per-run: ${LEDGER_RECALCULATION_MAX_ENTRIES_PER_RUN:5000}
  quota:
    # 회원당 저장 행수 상한. 익명 가입이 무료라 레이트 리밋으로는 저장 소진을 막을 수 없어 이 축이 따로 필요하다.
    max-entries-per-member: ${LEDGER_QUOTA_MAX_ENTRIES_PER_MEMBER:100000}

management:
  server:
    # actuator 를 애플리케이션 포트에서 떼어낸다. prometheus 스크랩 페이로드에는 JVM 상태·엔드포인트별 URI·
    # DB 풀 수치가 그대로 실리므로, 인터넷에 노출되는 8080 에 두면 안 된다. 이 포트는 컨테이너 밖으로
    # 매핑하지 않고 docker 내부망의 수집기만 접근한다 — 그게 /actuator/prometheus 를 permitAll 로 여는 근거다.
    # (별도 management context 도 security filter chain 을 물려받는다. 그래서 permitAll 이 필요했고,
    #  인증이 아니라 포트 격리가 실질 방어선이다. ActuatorPortSeparationTest 가 이 전제를 고정한다.)
    port: ${MANAGEMENT_SERVER_PORT:9091}
    # 기본값은 루프백이다 — 안전한 쪽이 기본이어야 한다. 호스트에서 jar 를 직접 돌리면(IDE 실행) 전 인터페이스
    # 바인딩은 같은 LAN 의 아무 기기에나 actuator 를 무인증으로 열어준다. 루프백으로 묶어도 로컬 관측은
    # 그대로 동작한다 — Docker Desktop 은 host.docker.internal 연결을 호스트 프로세스에서 프록시하므로
    # 수집기 컨테이너에는 루프백에서 온 연결로 도착한다(실측 확인).
    # 전 인터페이스 바인딩이 필요한 쪽은 9091 을 호스트로 매핑하지 않는 컨테이너 배포뿐이라,
    # application-prod.yml 에서만 명시적으로 선택한다(프로파일을 빼먹으면 안전한 쪽으로 떨어진다).
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        # 내부 전용 포트라도 최소만 연다. env·beans·heapdump 는 계속 닫아 둔다.
        include: health,prometheus
  endpoint:
    health:
      # 컨테이너 재시작 판정용이라 {"status":"UP"} 외에는 내보내지 않는다(DB 종류·디스크 용량 등 은닉).
      # DB 연결 상태는 노출되지 않을 뿐 판정에는 그대로 반영된다.
      show-details: never
  metrics:
    tags:
      # 여러 인스턴스·환경의 시계열을 Grafana 에서 구분하는 공통 라벨.
      application: ${WONI_METRICS_APPLICATION:woni-api}
    distribution:
      percentiles-histogram:
        # p95/p99 지연은 버킷이 있어야 PromQL 로 계산된다(histogram_quantile). 없으면 평균만 보인다.
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
