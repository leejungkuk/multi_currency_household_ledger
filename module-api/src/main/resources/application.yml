spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 단일 인스턴스 + 개인 규모 트래픽이라 기본값 10은 과하다. Supabase 무료 티어의 연결 수도 아껴야 한다.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # show-sql / format_sql 은 application-local.yml 에만 둔다 — 운영에서 켜면 모든 쿼리와 파라미터가
    # 로그로 쏟아져 로그량·성능·정보노출 문제가 된다.
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI}

  jackson:
    time-zone: Asia/Seoul
    # Jackson 3 는 프로퍼티를 알파벳순으로 정렬하는 등 기본값이 2.x 와 다르다. iOS 가 이미 받고 있는
    # 응답 형태를 유지하려고 2.x 기본값을 되살린다.
    use-jackson2-defaults: true
    deserialization:
      # 위 플래그(configureForJackson2)가 FAIL_ON_UNKNOWN_PROPERTIES 를 켜는데, Boot 3 는 이걸 false 로
      # 강제했었다. 세트로 두지 않으면 여분 필드가 섞인 요청이 200 에서 400 으로 뒤집힌다 — 구버전 앱과
      # 필드가 추가된 신버전 앱이 같은 서버를 쓰는 상황에서 그대로 장애다. 이 줄이 뒤에 적용돼 그것만 되돌린다.
      fail-on-unknown-properties: false

logging:
  level:
    # Hibernate 는 SQL 예외를 던지기 전에 이 로거로 먼저 WARN 을 남기는데, PostgreSQL 제약 위반 메시지는
    # 위반한 키 값을 그대로 담는다 — `Detail: Key (member_id)=(<uuid>) is not present in table "users"`.
    # 즉 탈퇴로 파기하겠다고 약속한 UUID 를 파기 실패 로그가 붙잡고(Loki 14일 잔존), 살아 있는 회원의
    # member_id 도 sync 유니크 경합마다 같은 경로로 샌다. 애플리케이션 코드로는 막을 수 없다 —
    # 우리 예외 핸들러가 도는 시점에는 이미 기록된 뒤다.
    #
    # 끄더라도 진단은 잃지 않는다. 500 으로 나가는 무결성 위반은 GlobalExceptionHandler 의 캐치올이
    # 예외 전체(PSQLException 메시지 포함)를 ERROR 로 남긴다. 이 로거를 꺼서 사라지는 것은
    # 의도적으로 삼키는 경로(import 409·sync 유니크 회복·환율 중복 skip)의 중복 기록뿐이고,
    # 셋 다 기대된 조건이라 진단 대상이 아니다.
    org.hibernate.orm.jdbc.error: 'OFF'

server:
  # 앱은 Caddy 뒤에서만 서비스된다(컨테이너가 8080 을 호스트로 퍼블리시하지 않는다). 이게 없으면 모든 요청의
  # remote address 가 Caddy 컨테이너 IP 로, 스킴이 http 로 보인다 — 접속 IP 로 판단하는 것(레이트 리밋·차단·감사)이
  # 전 사용자를 한 덩어리로 묶어 통째로 무력화된다.
  #
  # framework 가 아니라 native(Tomcat RemoteIpValve)인 이유는 신뢰 경계다. Caddy 실측 결과
  # X-Forwarded-For/Proto/Host 는 클라이언트가 보내도 Caddy 가 자기 값으로 교체하지만,
  # RFC 7239 Forwarded 헤더는 손대지 않고 그대로 통과시킨다. framework(ForwardedHeaderFilter)는
  # Forwarded 를 X-Forwarded-* 보다 우선하므로, 그 조합은 클라이언트가 IP·스킴·호스트를 마음대로
  # 주장하게 만든다 — 설정을 안 넣느니만 못하다. native 는 Forwarded 를 아예 보지 않고 X-Forwarded-* 만
  # 읽으며, 그마저도 요청이 사설대역(internalProxies 기본값 = docker 네트워크)에서 왔을 때만 신뢰한다.
  # ForwardedHeaderSecurityIntegrationTest 가 위조 차단을 실제 Tomcat 으로 고정한다.
  forward-headers-strategy: native

  compression:
    enabled: true
    mime-types: application/json
    # 주의: min-response-size 는 Content-Length 가 알려진 응답에만 적용된다.
    # Tomcat CompressionConfig.useCompression() 은 getContentLengthLong() == -1 이면 크기 비교를 건너뛴다.
    # Spring MVC 의 JSON 은 chunked 로 나가 Content-Length 가 -1 이므로, gzip 을 수락하는 클라이언트에게는
    # 크기와 무관하게 application/json 응답이 압축된다(Accept-Encoding·기존 Content-Encoding·strong ETag 등
    # 나머지 제외 조건은 그대로 적용된다). 이 값은 Content-Length 가 실리는 응답의 하한으로만 의미가 있다.
    min-response-size: 2KB

woni:
  security:
    # 최대 import 1000건은 memo 255자 한글 기준 약 933KB(911KiB)라 1536KB가 약 1.68배 여유다.
    # 300KB로 낮추면 정상 iOS 동기화가 깨진다. Caddy의 2MB보다 낮아 앱이 실질 구속조건이 되고,
    # 엣지에서 잘린 본문을 400으로 돌려주는 대신 앱이 의미 있는 413을 반환한다.
    max-request-body-size: ${WONI_MAX_REQUEST_BODY_SIZE:1536KB}
    rate-limit:
      enabled: ${WONI_RATE_LIMIT_ENABLED:true}
      read-limit: ${WONI_RATE_LIMIT_READ:120}
      write-limit: ${WONI_RATE_LIMIT_WRITE:60}
    jwt:
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    cors:
      allowed-origins: ${WONI_CORS_ALLOWED_ORIGINS:http://localhost:3000}

exchange:
  eximbank:
    api-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    connect-timeout: ${EXIMBANK_CONNECT_TIMEOUT:2s}
    read-timeout: ${EXIMBANK_READ_TIMEOUT:5s}

ledger:
  recalculation:
    window-days: ${LEDGER_RECALCULATION_WINDOW_DAYS:7}
    # 재계산 배치가 한 번에 붙잡는 트랜잭션·힙·커넥션의 상한. 청크마다 트랜잭션을 끊고(chunk-size),
    # 한 주기 처리량도 막는다(max-entries-per-run). 상한에 걸린 나머지는 대상 술어에 그대로 남아
    # 다음 주기가 이어받는다 — 초과분이 영구 동결되지 않는다.
    chunk-size: ${LEDGER_RECALCULATION_CHUNK_SIZE:200}
    max-entries-per-run: ${LEDGER_RECALCULATION_MAX_ENTRIES_PER_RUN:5000}
  quota:
    # 회원당 저장 행수 상한. 익명 가입이 무료라 레이트 리밋으로는 저장 소진을 막을 수 없어 이 축이 따로 필요하다.
    max-entries-per-member: ${LEDGER_QUOTA_MAX_ENTRIES_PER_MEMBER:100000}

management:
  server:
    # actuator 를 애플리케이션 포트에서 떼어낸다. prometheus 스크랩 페이로드에는 JVM 상태·엔드포인트별 URI·
    # DB 풀 수치가 그대로 실리므로, 인터넷에 노출되는 8080 에 두면 안 된다. 이 포트는 컨테이너 밖으로
    # 매핑하지 않고 docker 내부망의 수집기만 접근한다 — 그게 /actuator/prometheus 를 permitAll 로 여는 근거다.
    # (별도 management context 도 security filter chain 을 물려받는다. 그래서 permitAll 이 필요했고,
    #  인증이 아니라 포트 격리가 실질 방어선이다. ActuatorPortSeparationTest 가 이 전제를 고정한다.)
    port: ${MANAGEMENT_SERVER_PORT:9091}
    # 기본값은 루프백이다 — 안전한 쪽이 기본이어야 한다. 호스트에서 jar 를 직접 돌리면(IDE 실행) 전 인터페이스
    # 바인딩은 같은 LAN 의 아무 기기에나 actuator 를 무인증으로 열어준다. 루프백으로 묶어도 로컬 관측은
    # 그대로 동작한다 — Docker Desktop 은 host.docker.internal 연결을 호스트 프로세스에서 프록시하므로
    # 수집기 컨테이너에는 루프백에서 온 연결로 도착한다(실측 확인).
    # 전 인터페이스 바인딩이 필요한 쪽은 9091 을 호스트로 매핑하지 않는 컨테이너 배포뿐이라,
    # application-prod.yml 에서만 명시적으로 선택한다(프로파일을 빼먹으면 안전한 쪽으로 떨어진다).
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        # 내부 전용 포트라도 최소만 연다. env·beans·heapdump 는 계속 닫아 둔다.
        include: health,prometheus
  endpoint:
    health:
      # 컨테이너 재시작 판정용이라 {"status":"UP"} 외에는 내보내지 않는다(DB 종류·디스크 용량 등 은닉).
      # DB 연결 상태는 노출되지 않을 뿐 판정에는 그대로 반영된다.
      show-details: never
      probes:
        # Boot 4 가 이 기본값을 false→true 로 뒤집었다. 켜지면 응답에 groups:["liveness","readiness"] 가
        # 실려 show-details=never 인데도 status 외 필드가 무토큰 permitAll 경로로 나간다.
        # 지금은 단일 컨테이너 배포라 liveness/readiness 를 읽는 오케스트레이터가 없으므로 꺼서
        # Boot 3 와 같은 {"status":"UP"} 을 유지한다.
        # k8s 등으로 옮겨 프로브가 필요해지면 이 줄을 지워 되살리고, 그때 늘어나는 응답 필드를
        # ActuatorEndpointIntegrationTest 의 기대값과 함께 의도적으로 갱신한다.
        enabled: false
  metrics:
    tags:
      # 여러 인스턴스·환경의 시계열을 Grafana 에서 구분하는 공통 라벨.
      application: ${WONI_METRICS_APPLICATION:woni-api}
    distribution:
      percentiles-histogram:
        # p95/p99 지연은 버킷이 있어야 PromQL 로 계산된다(histogram_quantile). 없으면 평균만 보인다.
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    # springdoc 3.x 는 기본을 OpenAPI 3.1 로 바꿨다. api-contract/openapi.json 은 iOS 와의 계약 SSOT 라
    # 프레임워크 업그레이드가 스펙 방언을 바꾸면 안 된다(3.1 은 3.0 전용 코드 생성기가 못 읽는다).
    # 3.1 로 가는 것은 계약 변경이므로 별도 판단으로 한다.
    version: openapi_3_0
