# 로컬 개발 전용(bootRun 이 spring.profiles.active=local 을 강제한다).
#
# 로컬 시크릿(개발 DB 접속·수출입은행 키)은 여기서만 끌어온다. application.yml 에 두면
# 테스트와 운영까지 개발자 개인 자격증명을 읽게 되므로 프로파일 안으로 격리한다.
# optional: 이라 파일이 없어도 기동은 막지 않는다.
spring:
  config:
    import: optional:classpath:application-secret.yml

  # SQL 로그는 여기에만 둔다 — 운영 프로파일에는 실리지 않는다.
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
