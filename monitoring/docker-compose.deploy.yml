# 배포 호스트용 override. 스크랩 타깃을 host.docker.internal(로컬) 에서 api 컨테이너로 바꾼다.
#
# 이 파일은 단독으로 쓰지 않는다 — 배포 쪽 compose 가 include 로 base 와 함께 불러온다.
# woni 네트워크를 여기서 정의하지 않고 참조만 하는 것이 의도다: 실수로 monitoring 디렉터리에서
# 직접 올리면 "refers to undefined network woni" 로 즉시 실패한다(조용히 뜨고 타깃만 down 되는
# 것보다 낫다). 정상 경로에서는 api·caddy 를 담은 상위 compose 의 정의로 해석된다.
#
#   include:
#     - path:
#         - ../monitoring/docker-compose.yml
#         - ../monitoring/docker-compose.deploy.yml

services:
  prometheus:
    # monitoring 은 관측 스택 내부망, woni 는 api·caddy 가 있는 망이다. 둘을 다 붙이는 건
    # prometheus 뿐이라, node-exporter·loki·alloy·grafana 는 공개 트래픽 경로와 격리된 채로 남는다.
    networks: [monitoring, woni]
    volumes:
      # 같은 마운트 지점이라 base 의 targets/ 를 이 디렉터리로 갈아끼운다(→ woni-api:9091).
      # 나머지 볼륨은 base 그대로다. 상대경로는 이 파일 기준으로 해석된다(include 규칙).
      - ./prometheus/targets-deploy:/etc/prometheus/targets:ro
